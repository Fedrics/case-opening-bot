version: "3.8"
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:password@db:5432/case_opening_bot
    depends_on:
      - db
    volumes:
      - ./:/app
    
  db:
    image: postgres:13
    environment:
      POSTGRES_DB: case_opening_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: