<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка - Case Opening Bot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .error-container {
            text-align: center;
            background: #2a2a2a;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }
        
        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        .error-title {
            font-size: 24px;
            margin-bottom: 15px;
            color: #ff6b6b;
        }
        
        .error-message {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        .error-code {
            font-family: monospace;
            background: #1a1a1a;
            padding: 10px;
            border-radius: 10px;
            color: #ff9800;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">⚠️</div>
        <h1 class="error-title">Ошибка доступа</h1>
        <p class="error-message">
            {{ error }}
        </p>
        <div class="error-code">
            Доступ разрешен только через Telegram WebApp
        </div>
        <p class="error-message">
            Пожалуйста, используйте бота в Telegram для доступа к приложению.
        </p>
    </div>
</body>
</html>
